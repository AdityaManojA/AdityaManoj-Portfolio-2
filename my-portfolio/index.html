<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Aditya Manoj · Most Wanted</title>
    <meta name="description" content="Aditya Manoj, Full-Stack Developer & Systems Engineer. A portfolio played like the Need for Speed: Most Wanted (2005) front end." />
    <link rel="icon" type="image/svg+xml" href="./Aditya.svg" />
    <!-- First things the visitor sees: the start screen's lamps, then the menu art, fetched immediately. -->
    <link rel="preload" as="image" href="./nfsmw/loading-lamps.webp" fetchpriority="high" />
    <link rel="preload" as="image" href="./nfsmw/main-menu.webp" fetchpriority="high" />
    <link rel="preload" as="image" href="./nfsmw/ink.webp" />
    <style>
      /* Painted before the bundle loads: black, like the game's boot. */
      html, body { margin: 0; height: 100%; background: #000; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript style="color:#ccc;font-family:Arial,sans-serif;display:block;padding:2rem">This portfolio runs as a game menu and needs JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
