<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/Aditya.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aditya Manoj — Full-Stack Developer & Systems Engineer</title>
    <meta name="description" content="Portfolio of Aditya Manoj — Full-Stack Developer & Systems Engineer specializing in modern web applications, high-throughput PWAs, interactive 3D UI, and cloud-native systems." />
    <style>
      /* Percentage loader. Self-contained so it paints before the app bundle; colours mirror
         the site's paper/vermilion and graphite/amber themes. */
      #page-loader {
        --bg: #F3EEE4;
        --fg: #1A1916;
        --muted: #5F5B53;
        --accent: #C2410C;
        --track: #DDD5C7;
        position: fixed;
        inset: 0;
        z-index: 2000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        background: var(--bg);
        color: var(--fg);
        font-family: "Montserrat", "Segoe UI", system-ui, sans-serif;
        transition: opacity 0.5s ease, transform 0.6s cubic-bezier(0.7, 0, 0.3, 1);
      }
      html.loader-dark #page-loader {
        --bg: #0E0E10;
        --fg: #FAFAF9;
        --muted: #A1A1AA;
        --accent: #F5B544;
        --track: #27272A;
      }
      .pl-count {
        font-size: clamp(4rem, 14vw, 9rem);
        font-weight: 700;
        letter-spacing: -0.05em;
        line-height: 1;
        font-variant-numeric: tabular-nums;
      }
      .pl-count span { color: var(--accent); }
      .pl-label {
        font-size: 0.7rem;
        font-weight: 600;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .pl-track {
        position: relative;
        width: min(320px, 70vw);
        height: 2px;
        background: var(--track);
      }
      .pl-fill {
        position: absolute;
        inset: 0;
        background: var(--accent);
        transform-origin: left;
        transform: scaleX(0);
      }
      #page-loader.pl-done {
        opacity: 0;
        transform: translateY(-2%);
        pointer-events: none;
      }
      html.loader-active body { overflow: hidden; }
    </style>
    <script>
      var loaderDark = true;
      try {
        loaderDark = localStorage.getItem('theme-preference') !== 'light';
      } catch (e) {}
      if (loaderDark) document.documentElement.classList.add('loader-dark');
      document.documentElement.classList.add('loader-active');
    </script>
  </head>
  <body>
    <div id="page-loader" role="progressbar" aria-label="Loading portfolio" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="pl-count"><b id="pl-num">0</b><span>%</span></div>
      <div class="pl-track"><div class="pl-fill" id="pl-fill"></div></div>
      <div class="pl-label">Loading portfolio</div>
    </div>
    <script>
      // Counts 0 → 100 over 3.5 s from navigation start, then reveals the landing page as soon
      // as the app has rendered into #root.
      (function () {
        var DURATION = 3500;
        var loader = document.getElementById('page-loader');
        var num = document.getElementById('pl-num');
        var fill = document.getElementById('pl-fill');
        function finish() {
          var root = document.getElementById('root'); // declared after this script
          if (!root || !root.firstChild) return setTimeout(finish, 50);
          loader.classList.add('pl-done');
          document.documentElement.classList.remove('loader-active', 'loader-dark');
          setTimeout(function () { loader.remove(); }, 650);
        }
        function tick() {
          var p = Math.min(1, performance.now() / DURATION);
          var pct = Math.round(p * 100);
          num.textContent = pct;
          fill.style.transform = 'scaleX(' + p + ')';
          loader.setAttribute('aria-valuenow', pct);
          // A timer, not requestAnimationFrame: rAF stops in background tabs and would hold the
          // loader until the tab is shown.
          if (p < 1) setTimeout(tick, 16);
          else finish();
        }
        tick();
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
