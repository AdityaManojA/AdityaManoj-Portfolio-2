<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0b" />
    <!-- Title, description, canonical URL, share tags and JSON-LD are written here per page
         at build time by the search-pages plugin in vite.config.ts. -->
    <!--seo:head-->

    <!-- Fonts are served from this site (public/fonts), not a font service, so no visitor
         data goes to a third party. Inter 500 is preloaded because the loader uses it. -->
    <link rel="preload" href="/fonts/inter-500.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/instrument-serif-400.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face { font-family: 'Instrument Serif'; font-style: normal; font-weight: 400; font-display: swap; src: url('/fonts/instrument-serif-400.woff2') format('woff2'); }
      /* Stand-ins for Instrument Serif while it loads, or where web fonts are blocked (iOS
         Lockdown Mode, some data savers). Instrument Serif is narrow: the system serifs are
         20 to 35% wider, which made long lines wrap. size-adjust shrinks each stand-in to the
         same width, so the layout is the same with or without the real font. */
      @font-face { font-family: 'Serif Stand-in G'; src: local('Georgia'); size-adjust: 75.3%; }
      @font-face { font-family: 'Serif Stand-in T'; src: local('Times New Roman'), local('Times'); size-adjust: 82.2%; }
      @font-face { font-family: 'Serif Stand-in N'; src: local('Noto Serif'); size-adjust: 74%; }
      @font-face { font-family: 'Inter'; font-style: normal; font-weight: 400; font-display: swap; src: url('/fonts/inter-400.woff2') format('woff2'); }
      @font-face { font-family: 'Inter'; font-style: normal; font-weight: 500; font-display: swap; src: url('/fonts/inter-500.woff2') format('woff2'); }

      /* Page loader: the "Type" cursor signs the page, the name holds for a beat, then it
         lifts toward the nav while the project cards fly in behind it (ProjectsView runs
         that second half). Self-contained so it paints before the app bundle arrives. */
      html { background: #0a0a0b; }
      #page-loader {
        position: fixed;
        inset: 0;
        z-index: 2000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a0b;
        color: #f2f1ee;
        transition: background-color 0.55s ease;
      }
      .pl-name {
        position: relative;
        /* The nav's typeface, so the name reads as the same voice as "AM .Dev". */
        font: 500 clamp(30px, 8.6vw, 76px) / 1 Inter, system-ui, sans-serif;
        letter-spacing: -0.035em;
        white-space: nowrap;
        min-height: 1em;
        transition: transform 0.6s cubic-bezier(0.6, 0, 0.2, 1), opacity 0.5s ease 0.1s;
      }
      .pl-caret {
        display: inline-block;
        width: 2px;
        height: 0.82em;
        margin-left: 0.04em;
        vertical-align: -0.08em;
        background: #f2f1ee;
      }
      .pl-cursor {
        position: absolute;
        left: 100%;
        top: 62%;
        margin-left: 6px;
        line-height: 0;
        transition: opacity 0.25s ease;
      }
      .pl-cursor svg { display: block; }
      .pl-cursor span {
        position: absolute;
        left: 15px;
        top: 15px;
        font: 400 11px/1 Inter, system-ui, sans-serif;
        color: #0a0a0b;
        background: #5eead4;
        padding: 4px 7px;
        border-radius: 3px 9px 9px 9px;
      }
      /* Leaving: the backdrop clears and the name rises to where the nav sits. */
      #page-loader.pl-done { background-color: rgba(10, 10, 11, 0); pointer-events: none; }
      #page-loader.pl-done .pl-name { transform: translateY(calc(-50vh + 30px)) scale(0.22); opacity: 0; }
      #page-loader.pl-done .pl-cursor, #page-loader.pl-done .pl-caret { opacity: 0; }
      html.loader-active body { overflow: hidden; }
      @media (prefers-reduced-motion: reduce) {
        .pl-name { transition: opacity 0.3s ease; }
        #page-loader.pl-done .pl-name { transform: none; }
      }

      /* The plain version of the site that sits in #root until the app starts
         (see staticFallback in vite.config.ts). Only seen without JavaScript. */
      .fallback { max-width: 720px; margin: 0 auto; padding: 72px 20px; color: #f2f1ee; font: 16px/1.6 Inter, system-ui, sans-serif; }
      .fallback h1, .fallback h2 { font-family: 'Instrument Serif', 'Serif Stand-in G', 'Serif Stand-in T', 'Serif Stand-in N', serif; font-weight: 400; line-height: 1.1; }
      .fallback h1 { font-size: 40px; }
      .fallback h2 { font-size: 30px; margin-top: 48px; }
      .fallback h3 { font-size: 17px; font-weight: 500; margin: 28px 0 4px; }
      .fallback p { margin: 0 0 12px; color: #c9c8c4; }
      .fallback a { color: #f2f1ee; text-decoration: underline; }
    </style>
    <noscript>
      <style>
        #page-loader { display: none; }
      </style>
    </noscript>
    <script>
      document.documentElement.classList.add('loader-active');
    </script>
  </head>
  <body>
    <div id="page-loader" role="status" aria-label="Loading portfolio">
      <div class="pl-name" aria-hidden="true">
        <span id="pl-text"></span><span class="pl-caret"></span>
        <div class="pl-cursor">
          <svg width="18" height="18" viewBox="0 0 15 15"><path d="M1.5 1.5v11l3.4-3 2.4 4.4 2-1-2.3-4.3 4.5-.3z" fill="#5eead4" stroke="#0a0a0b" stroke-width="1"/></svg>
          <span>Type</span>
        </div>
      </div>
    </div>
    <script>
      // Types the name from navigation start, holds it fully typed for half a second, then
      // hands over to the page as soon as the app has rendered.
      (function () {
        var NAME = 'Aditya Manoj';
        var START = 150; // ms before the first letter
        var TYPE = 800; // ms to type the whole name
        var HOLD = 500; // ms the finished name stays on screen
        var loader = document.getElementById('page-loader');
        var text = document.getElementById('pl-text');
        function finish() {
          // .nav is rendered by the app. #root alone is no signal: it already holds the
          // static fallback before the app starts.
          if (!document.querySelector('.nav')) return setTimeout(finish, 50);
          loader.classList.add('pl-done');
          document.documentElement.classList.remove('loader-active');
          setTimeout(function () { loader.remove(); }, 750);
        }
        function tick() {
          var p = Math.min(1, Math.max(0, (performance.now() - START) / TYPE));
          var n = Math.round(p * NAME.length);
          if (text.textContent.length !== n) text.textContent = NAME.slice(0, n);
          // A timer, not requestAnimationFrame: rAF stops in background tabs and would hold the
          // loader until the tab is shown.
          if (p < 1) setTimeout(tick, 16);
          else setTimeout(finish, HOLD);
        }
        tick();
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
