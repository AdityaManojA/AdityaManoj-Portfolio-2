<!doctype html>
<!--
  The link-preview image (og:image) shown when the site is shared on WhatsApp, LinkedIn,
  X or Slack. 1200 × 630. It is the loader's finished frame: the name typed out in the
  nav's typeface, with the caret and the "Type" cursor.

  WhatsApp's small preview crops this to the middle square (630 × 630), so the name and
  the cursor together stay inside the middle 560px.

  Chat apps cache this image by its URL, so a redesign needs a new file name (change it
  in vite.config.ts and render-covers.sh too).

  Render it to public/share-card.png with:  bash scripts/render-covers.sh
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Inter'; font-weight: 400; src: url('../../public/fonts/inter-400.woff2') format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 500; src: url('../../public/fonts/inter-500.woff2') format('woff2'); }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #0a0a0b; color: #f2f1ee; }
  body { display: flex; align-items: center; justify-content: center; }
  /* The padding makes room for the cursor, so the pair is centred, not the name alone. */
  .group { padding-right: 84px; }
  .name { position: relative; font: 500 84px/1 Inter, system-ui, sans-serif; letter-spacing: -0.035em; white-space: nowrap; }
  .caret { display: inline-block; width: 3px; height: 0.82em; margin-left: 0.04em; vertical-align: -0.08em; background: #f2f1ee; }
  .cursor { position: absolute; left: 100%; top: 62%; margin-left: 8px; line-height: 0; }
  .cursor svg { display: block; }
  .cursor span { position: absolute; left: 21px; top: 21px; font: 400 15px/1 Inter, system-ui, sans-serif; letter-spacing: 0; color: #0a0a0b; background: #5eead4; padding: 6px 10px; border-radius: 4px 12px 12px 12px; }
</style>
</head>
<body>
  <div class="group">
    <div class="name">Aditya Manoj<span class="caret"></span>
      <div class="cursor">
        <svg width="25" height="25" viewBox="0 0 15 15"><path d="M1.5 1.5v11l3.4-3 2.4 4.4 2-1-2.3-4.3 4.5-.3z" fill="#5eead4" stroke="#0a0a0b" stroke-width="1"/></svg>
        <span>Type</span>
      </div>
    </div>
  </div>
</body>
</html>
