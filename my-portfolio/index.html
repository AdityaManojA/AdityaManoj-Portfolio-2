<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/Aditya.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0b" />
    <title>Aditya Manoj — Full-Stack Developer & Systems Engineer</title>
    <meta name="description" content="Portfolio of Aditya Manoj — Full-Stack Developer & Systems Engineer specializing in modern web applications, high-throughput PWAs, interactive 3D UI, and cloud-native systems." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      /* Page loader. Self-contained so it paints before the app bundle arrives. */
      html { background: #0a0a0b; }
      #page-loader {
        position: fixed;
        inset: 0;
        z-index: 2000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a0b;
        color: #f2f1ee;
        font: 500 13px Inter, system-ui, sans-serif;
        transition: opacity 0.45s ease;
      }
      .pl-count {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 22px;
        text-align: center;
        font: 400 16px 'Instrument Serif', Georgia, serif;
        font-variant-numeric: tabular-nums;
      }
      #page-loader.pl-done { opacity: 0; pointer-events: none; }
      html.loader-active body { overflow: hidden; }
    </style>
    <script>
      document.documentElement.classList.add('loader-active');
    </script>
  </head>
  <body>
    <div id="page-loader" role="progressbar" aria-label="Loading portfolio" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <span>AM .Dev</span>
      <div class="pl-count" id="pl-num">000</div>
    </div>
    <script>
      // Counts 000 → 100 from navigation start, then reveals the page once the app has
      // rendered into #root.
      (function () {
        var DURATION = 1400;
        var loader = document.getElementById('page-loader');
        var num = document.getElementById('pl-num');
        function finish() {
          var root = document.getElementById('root'); // declared after this script
          if (!root || !root.firstChild) return setTimeout(finish, 50);
          loader.classList.add('pl-done');
          document.documentElement.classList.remove('loader-active');
          setTimeout(function () { loader.remove(); }, 500);
        }
        function tick() {
          var p = Math.min(1, performance.now() / DURATION);
          var pct = Math.round(p * 100);
          num.textContent = ('00' + pct).slice(-3);
          loader.setAttribute('aria-valuenow', pct);
          // A timer, not requestAnimationFrame: rAF stops in background tabs and would hold the
          // loader until the tab is shown.
          if (p < 1) setTimeout(tick, 16);
          else finish();
        }
        tick();
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
